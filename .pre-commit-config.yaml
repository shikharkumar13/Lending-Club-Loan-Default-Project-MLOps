# Runs on every `git commit`: catches lint errors before they reach history.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff            # lint
        args: [--fix]
      - id: ruff-format     # format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5000]   # stops a stray parquet/csv from entering git
