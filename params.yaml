# Single source of configuration for the whole pipeline.
# Anything a human might want to change lives here, not in the code:
# that way `dvc repro` knows a parameter changed and reruns the right stage,
# and every experiment can be traced back to an exact config.

seed: 42

paths:
  raw_csv: data/raw/accepted_2007_to_2018Q4.csv
  raw_parquet: data/interim/accepted_raw.parquet      # allowlisted columns only
  prepared: data/interim/prepared.parquet             # cleaned + labeled
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures

data:
  # --- target (D-003) ---
  positive_statuses: ["Charged Off", "Default"]
  negative_statuses: ["Fully Paid"]
  # Loans whose outcome is not yet known are dropped entirely.
  drop_statuses: ["Current", "In Grace Period", "Late (16-30 days)", "Late (31-120 days)"]
  # "Does not meet the credit policy. Status:..." rows are kept and flagged (D-026).
  keep_credit_policy_loans: true

  # --- maturity filter (D-004) ---
  terms_months: [36]              # 60-month loans excluded in v1
  max_issue_date: "2015-12-01"    # 36 months + buffer before the 2018Q4 snapshot
  min_issue_date: "2007-06-01"

split:                             # by issue date (D-005)
  train: {start: "2007-06-01", end: "2013-12-31"}
  validation: {start: "2014-01-01", end: "2014-12-31"}
  test: {start: "2015-01-01", end: "2015-12-31"}
  # Expanding-window CV inside the training period (D-022).
  cv_folds:
    - {train_end: "2010-12-31", validate_year: 2011}
    - {train_end: "2011-12-31", validate_year: 2012}
    - {train_end: "2012-12-31", validate_year: 2013}

features:
  # FINAL allowlist (D-006), audited in Phase 1. Only these may become model inputs.
  # Removed after the Phase 1 recon (D-030):
  #   mort_acc, tot_cur_bal, tot_coll_amt -> 100% missing before 2012, so the
  #     missingness encodes "old loan" and would not generalize
  #   application_type -> 99.96% "Individual" in our window (no signal)
  allowlist:
    - loan_amnt
    - term
    - int_rate
    - installment
    - grade
    - sub_grade
    - emp_length
    - home_ownership
    - annual_inc
    - verification_status
    - purpose
    - addr_state
    - dti
    - delinq_2yrs
    - earliest_cr_line
    - fico_range_low
    - fico_range_high
    - inq_last_6mths
    - mths_since_last_delinq
    - mths_since_last_record
    - open_acc
    - pub_rec
    - revol_bal
    - revol_util
    - total_acc
    - initial_list_status
    - pub_rec_bankruptcies
    - acc_now_delinq
    - collections_12_mths_ex_med

  # Needed by the pipeline but never used as model inputs:
  # issue_d -> splitting, loan_status -> label, payment columns -> realized profit (D-008).
  bookkeeping:
    - issue_d
    - loan_status
    - total_pymnt
    - recoveries
    - funded_amnt

  # Any column whose name starts with one of these must never reach the model.
  # Enforced by a test (D-010 leakage safeguards).
  forbidden_prefixes:
    - total_pymnt
    - total_rec
    - out_prncp
    - last_pymnt
    - next_pymnt
    - last_credit_pull
    - last_fico
    - recoveries
    - collection_recovery
    - hardship
    - settlement
    - debt_settlement
    - pymnt_plan

  # Sentinel for "this never happened" (D-017); the columns are listed under
  # groups.structural_missing, which is the single source of truth.
  never_happened_sentinel: 999

  # --- feature groups used to build the sklearn pipeline (Phase 2) ---
  # Each group gets a different treatment; the code reads these lists, so adding
  # a column here is enough to change the pipeline.
  groups:
    # Skewed money columns: cap at the training percentile, then log1p (D-019).
    skewed_amount: [annual_inc, revol_bal]
    # Ordinary numeric: median imputation, no missing indicator.
    # (Audit finding D-040: these columns are missing for the same ~30 early
    # loans, so their indicators were seven identical columns.)
    numeric:
      - loan_amnt
      - int_rate
      - installment
      - dti
      - delinq_2yrs
      - inq_last_6mths
      - open_acc
      - pub_rec
      - total_acc
      - acc_now_delinq
      - collections_12_mths_ex_med
      - fico_mid
      - credit_history_months
      - loan_to_income
      - installment_to_income
    # Median imputation PLUS a missing indicator, because for these columns
    # being missing predicts default on its own (D-040):
    #   emp_length_years     4.3% missing -> 18.2% default vs 12.4%
    #   pub_rec_bankruptcies 0.8% missing -> 24.5% default vs 12.5%
    #   revol_util           0.1% missing -> 16.9% default vs 12.6%
    numeric_with_indicator: [emp_length_years, pub_rec_bankruptcies, revol_util]
    # "Never happened" columns: sentinel + missing indicator (D-017, D-031).
    structural_missing: [mths_since_last_delinq, mths_since_last_record]
    # Ordered categories -> integer codes that preserve the order (D-018).
    ordinal:
      grade: [A, B, C, D, E, F, G]
      sub_grade: null        # generated as A1..G5 in code
    # Unordered categories -> one-hot, rare levels grouped into "other".
    nominal: [home_ownership, verification_status, purpose, addr_state, initial_list_status]
    # Already 0/1.
    boolean: [not_credit_policy]
    # Excluded from the model on purpose:
    #   term_months     -> always 36 in v1 (no variance)
    #   fico_range_low/high -> replaced by fico_mid
    #   issue_date      -> used for splitting only; as a feature it would just
    #                      encode "which year", which does not transfer to new loans

  cap_percentile: 0.995
  rare_category_min_frequency: 0.01     # levels below 1% of training rows -> "other"
  # Measured on TRAIN only; above this share of missing values a column is dropped.
  # never_happened_columns are exempt: their missingness is meaningful, not absent
  # data (D-031). mths_since_last_record is 90% missing and still kept.
  max_missing_fraction: 0.5

profit:
  # Expected return per loan (D-009). LGD is re-estimated from TRAIN data in
  # Phase 4; this fallback is the Phase 1 measurement (D-032): charged-off loans
  # repay on average 63.5% of the funded amount, so the loss is ~36.5%.
  lgd_fallback: 0.365
  threshold_grid: {start: 0.02, stop: 0.60, step: 0.005}

model:
  logistic_regression:
    C: [0.01, 0.1, 1.0]
    class_weight: [null, balanced]
  lightgbm:
    n_iter: 25                # randomized search budget
    fixed:
      objective: binary
      n_estimators: 2000
      learning_rate: 0.05
      early_stopping_rounds: 100
